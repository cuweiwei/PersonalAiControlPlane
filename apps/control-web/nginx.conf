server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  add_header Cache-Control "no-store" always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self'; style-src 'self'; script-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  location = /health/live { default_type application/json; return 200 '{"status":"ok"}'; }
  location / { try_files $uri $uri/ /index.html; }
}
