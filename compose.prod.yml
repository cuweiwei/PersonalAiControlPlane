name: personal-ai-control-plane

services:
  pai-control-plane:
    image: ghcr.io/cuweiwei/personal-ai-control-plane@sha256:d177fc51221079024ecfb5d5c4ab68ad1c5d34ccbee53560deeba74a2862d68e
    restart: unless-stopped
    user: "106808:106808"
    command: ["node", "--experimental-strip-types", "apps/control-plane/src/index.ts"]
    environment:
      NODE_ENV: production
      PAI_PORT: "8080"
      PAI_LISTEN_ADDRESS: "0.0.0.0"
      PAI_DATA_DIR: /data
      PAI_ARTIFACT_DIR: /data/artifacts
      PAI_HERMES_URL: ${PAI_HERMES_URL:-http://hermes-agent:9119}
      PAI_CONTROL_PLANE_ENTRY_URL: ${PAI_CONTROL_PLANE_ENTRY_URL:-https://gnest.taila77e5f.ts.net/}
      PAI_HERMES_ENTRY_URL: ${PAI_HERMES_ENTRY_URL:-https://gnest.taila77e5f.ts.net:9119/}
      PAI_HERMES_BRAIN_V2_ENABLED: "true"
      PAI_HERMES_OFFICE_URL: ${PAI_HERMES_OFFICE_URL:-http://hermes-agent:9121}
      # Fixed private service identity; the runtime resolves this alias and
      # still compares the real socket peer address (never a forwarded header).
      PAI_OFFICE_TRUSTED_PEERS: ${PAI_OFFICE_TRUSTED_PEERS:-hermes-agent}
      PAI_HERMES_TASK_EVENT_PATH: ${PAI_HERMES_TASK_EVENT_PATH:-/api/internal/control-plane/task-events}
      PAI_CONTEXTHUB_URL: ${PAI_CONTEXTHUB_URL:-http://contexthub:8787}
      PAI_CONTEXTHUB_ENTRY_URL: ${PAI_CONTEXTHUB_ENTRY_URL:-https://gnest.taila77e5f.ts.net:8443/dashboard}
      PAI_INFORMATION_RADAR_URL: ${PAI_INFORMATION_RADAR_URL:-http://radar-web:8787}
      PAI_INFORMATION_RADAR_HEALTH_PATH: ${PAI_INFORMATION_RADAR_HEALTH_PATH:-/health/ready}
      PAI_INFORMATION_RADAR_ENTRY_URL: ${PAI_INFORMATION_RADAR_ENTRY_URL:-https://gnest.taila77e5f.ts.net:8789/}
      PAI_REGISTRATION_ENABLED: ${PAI_REGISTRATION_ENABLED:-true}
      PAI_MAX_ARTIFACT_BYTES: ${PAI_MAX_ARTIFACT_BYTES:-1073741824}
    volumes:
      # Fresh v2 state lives beside, but outside, the legacy v1 data folders.
      # The override remains available for an operator-managed project root.
      - ${PAI_DATA_ROOT:-/volume1/docker/PersonalAiControlPlane/identity/data}:/data
    ports:
      - "127.0.0.1:9084:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
    networks:
      personal-ai-network:
        aliases:
          - personal-ai-control-plane
      information-radar-default: {}

networks:
  personal-ai-network:
    external: true
  information-radar-default:
    external: true
    name: information-radar_default
