name: personal-ai-control-plane

services:
  pai-control-web:
    image: ${PAI_CONTROL_WEB_IMAGE:?PAI_CONTROL_WEB_IMAGE must be immutable}
    restart: unless-stopped
    user: "101:101"
    ports:
      - "127.0.0.1:9083:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health/live"]
      interval: 10s
      timeout: 3s
      retries: 6
    networks:
      default: {}
      aihp-edge:
        aliases:
          - pai-edge-control-web

  pai-identity-gateway:
    image: ${PAI_ORCHESTRATOR_IMAGE:?PAI_ORCHESTRATOR_IMAGE must be immutable}
    restart: unless-stopped
    # Synology bind roots grant write access to the non-root ContainerManager UID.
    user: "106808:106808"
    command: ["node", "--experimental-strip-types", "apps/identity-gateway/src/index.ts"]
    environment:
      NODE_ENV: production
      PAI_OPERATIONAL_PROFILE: compatibility
      PAI_IDENTITY_PORT: "9084"
      PAI_IDENTITY_DB_PATH: /var/lib/pai/identity.db
      PAI_CANONICAL_ORIGIN: ${PAI_CANONICAL_ORIGIN:?PAI_CANONICAL_ORIGIN is required}
      PAI_WEBAUTHN_RP_ID: ${PAI_WEBAUTHN_RP_ID:?PAI_WEBAUTHN_RP_ID is required}
      PAI_WEBAUTHN_RP_NAME: ${PAI_WEBAUTHN_RP_NAME:-Personal AI Control Plane}
      # The token is only used for the first owner registration and must stay
      # in the root-controlled production .env. It is never committed or logged.
      PAI_BOOTSTRAP_TOKEN: ${PAI_BOOTSTRAP_TOKEN:-}
    volumes:
      - ${PAI_IDENTITY_DATA_ROOT:?PAI_IDENTITY_DATA_ROOT must be project-scoped}/data:/var/lib/pai
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9084/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
    networks:
      default: {}
      aihp-edge:
        aliases:
          - pai-edge-identity

  pai-orchestrator:
    image: ${PAI_ORCHESTRATOR_IMAGE:?PAI_ORCHESTRATOR_IMAGE must be immutable}
    restart: unless-stopped
    # Keep the orchestrator non-root while matching the NAS ContainerManager ACL.
    user: "106808:106808"
    environment:
      NODE_ENV: production
      PAI_OPERATIONAL_PROFILE: compatibility
      PAI_PORT: "9085"
      PAI_IDENTITY_HEALTH_URL: http://pai-identity-gateway:9084/health/ready
      PAI_ORCHESTRATOR_DB_PATH: /var/lib/pai/orchestrator.db
      PAI_CONVERSATION_DB_PATH: /var/lib/pai/conversation.db
      PAI_ARTIFACT_ROOT: /var/lib/pai/artifacts
      PAI_ORCHESTRATOR_LOCK_PATH: /var/lib/pai/orchestrator.lock
    volumes:
      - ${PAI_ORCHESTRATOR_DATA_ROOT:?PAI_ORCHESTRATOR_DATA_ROOT must be project-scoped}/data:/var/lib/pai
    ports:
      - "127.0.0.1:9085:9085"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9085/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
    networks:
      default: {}
      aihp-edge:
        aliases:
          - pai-edge-orchestrator

networks:
  aihp-edge:
    external: true
    name: ai-home-platform_edge
