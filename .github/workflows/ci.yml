name: personal-ai-control-plane

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
      - run: npm ci
      - run: npm run check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows installer
        shell: pwsh
        run: |
          $source = Get-Content packaging/windows/install-worker.ps1 -Raw
          [void][scriptblock]::Create($source)
  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    needs: [check, windows-installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/personal-ai-control-plane:sha-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: Generate release manifest
        env:
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_SERVICE_ID: personal-ai-control-plane
          RELEASE_DEPLOYMENT_PROJECT_ID: PersonalAiControlPlane
          RELEASE_IMAGE_REFERENCE: ghcr.io/${{ github.repository_owner }}/personal-ai-control-plane@${{ steps.build.outputs.digest }}
          RELEASE_IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          node scripts/render-release-compose.mjs
          cd release-artifacts
          node ../scripts/release-artifact.mjs --output .
          cd ..
          node scripts/verify-release-bundle.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: personal-ai-control-plane-release-${{ github.sha }}
          path: release-artifacts/
          if-no-files-found: error
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: image
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/deploy.yml
    with:
      image-digest: ${{ needs.image.outputs.digest }}
