name: personal-ai-control-plane

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build:web
  image:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/personal-ai-control-plane:sha-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: Generate release manifest
        env:
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_SERVICE_ID: personal-ai-control-plane
          RELEASE_DEPLOYMENT_PROJECT_ID: PersonalAiControlPlane
          RELEASE_IMAGE_REFERENCE: ghcr.io/${{ github.repository_owner }}/personal-ai-control-plane:sha-${{ github.sha }}
          RELEASE_IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: npm run release:artifact
      - uses: actions/upload-artifact@v4
        with:
          name: aihome-release-${{ github.sha }}
          path: release-artifacts/release-manifest-${{ github.sha }}.json
          if-no-files-found: error
