<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Personal AI · 統一介面設計稿</title><style>
:root{--bg:#f2f1eb;--paper:#faf9f4;--ink:#273d38;--muted:#6e796e;--line:#dcded3;--green:#365848}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 Inter,"Noto Sans TC",system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:5px;background:var(--paper);color:var(--ink);padding:8px 14px}button:hover{background:#e7ede2}button:focus-visible,input:focus-visible{outline:3px solid #6b8b78;outline-offset:3px}.primary{background:var(--green);color:white;border-color:var(--green)}.primary:hover{background:#426751}header{background:#18292b;color:#bbc9bf;padding:15px 32px;display:flex;align-items:center;gap:40px}.brand{display:flex;align-items:center;gap:12px;white-space:nowrap}.mark{font:italic 30px Georgia;color:#cfdbc8}.brand b{font-size:11px;letter-spacing:2px;display:block}.brand small{font-size:9px;letter-spacing:2px}nav{display:flex;gap:5px;flex-wrap:wrap}nav button{background:transparent;border-color:transparent;color:#bbc9bf;font-size:12px;padding:7px 12px}nav button[aria-current=page]{background:#2b4440;border-color:#647d73;color:white}.demo{background:#e6ebdf;border-bottom:1px solid #cdd7c3;padding:7px 32px;color:#54684f;font-size:11px;display:flex;justify-content:space-between}.heading{padding:28px 36px 23px;background:var(--paper);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.title{display:flex;gap:18px;align-items:center}.monogram{font:italic 48px Georgia;color:#456153}.eyebrow{font-size:10px;letter-spacing:2px;color:#70816e}h1{font-size:26px;letter-spacing:-1px;font-weight:550;margin:2px 0}h2{font-size:19px;font-weight:550;margin:0 0 9px}h3{font-size:14px;font-weight:550;margin:0 0 5px}p{margin:6px 0;color:var(--muted);font-size:12px}.content{max-width:1500px;margin:auto;padding:28px 36px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}.stat{padding:18px 22px;background:var(--paper);border:1px solid var(--line);border-radius:7px;display:flex;align-items:center;justify-content:space-between}.stat span{font-size:12px;color:var(--muted)}.stat strong{font:32px Georgia}.split{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:8px;overflow:hidden}.pad{padding:24px}.section{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.badge{display:inline-flex;align-items:center;gap:6px;border-radius:4px;padding:3px 8px;font-size:11px;background:#e7ede2;color:#42624b;white-space:nowrap}.badge:before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor}.amber{background:#f3e6cf;color:#87612c}.neutral{background:#e9e9e2;color:#687366}.red{background:#f1e1d5;color:#915c44}.row{padding:18px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px}.row:last-child{border-bottom:0}.avatar{width:36px;height:36px;display:grid;place-items:center;background:#e5e8de;border:1px solid #d8dfcd;border-radius:50%;font:19px Georgia;flex-shrink:0}.grow{flex:1}.small{font-size:11px;color:var(--muted)}.rule{border-top:1px solid var(--line);margin:22px 0}.quiet{background:transparent;border-color:transparent;font-size:12px}.aside-note{margin-top:28px;font-size:11px;color:#7b8575}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.column{background:#eaece3;border:1px solid var(--line);border-radius:7px;padding:14px;min-height:365px}.column-title{font-size:12px;display:flex;justify-content:space-between;margin-bottom:18px}.mission{display:block;text-align:left;width:100%;background:var(--paper);padding:17px;margin:0 0 12px}.mission h3{margin:12px 0 9px}.mission .small{display:block;margin-top:18px}.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:20px}.toolbar input{margin-left:auto;max-width:210px;width:100%;border:1px solid var(--line);background:var(--paper);border-radius:5px;padding:8px 12px;color:var(--ink)}table{border-collapse:collapse;width:100%;font-size:12px}th{text-align:left;font-size:10px;font-weight:500;color:var(--muted);background:#eeefe7;padding:12px 17px}td{padding:18px 17px;border-bottom:1px solid var(--line)}td small{display:block;color:var(--muted);margin-top:4px;font-size:10px}tr.selected{background:#eaf0e4}tbody tr{cursor:pointer}tbody tr:hover{background:#eff2e9}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.facts{display:grid;grid-template-columns:1fr 1fr;gap:17px;margin:22px 0}.facts span{display:block;font-size:10px;color:var(--muted)}.facts b{font-size:12px;font-weight:500}.meter{height:5px;background:#e3e6da;border-radius:4px;margin:10px 0 20px}.meter i{display:block;height:100%;background:#789176;width:38%;border-radius:4px}.activity{border-top:1px solid var(--line);margin-top:26px;padding:15px 0;display:flex;gap:28px;font-size:11px;color:var(--muted)}footer{padding:16px 36px;color:#7c837a;font-size:10px;border-top:1px solid var(--line)}.settings{max-width:900px}.setting{display:flex;justify-content:space-between;align-items:center;padding:20px 0;border-bottom:1px solid var(--line)}.setting select{padding:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:4px}.tokens{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}.swatch{font-size:10px;display:flex;align-items:center;gap:7px}.swatch i{width:20px;height:20px;border:1px solid #ccc;border-radius:50%}dialog{border:1px solid var(--line);border-radius:9px;background:var(--paper);color:var(--ink);max-width:580px;padding:30px;width:90%}dialog::backdrop{background:#18292b66}@media(max-width:950px){header{gap:20px;padding:15px 20px;flex-wrap:wrap}.split{grid-template-columns:1fr}.board,.cards{grid-template-columns:repeat(2,1fr)}.content{padding:20px}.heading{padding:22px 20px}.tablewrap{overflow:auto}}@media(max-width:580px){.stats,.board,.cards{grid-template-columns:1fr 1fr}.stat{padding:12px}.stat strong{font-size:24px}.board{grid-template-columns:1fr}.heading{gap:15px}.monogram{display:none}.demo span:last-child{display:none}.activity{flex-wrap:wrap;gap:10px}.cards{grid-template-columns:1fr}}
</style></head><body>
<header><div class="brand"><span class="mark">P</span><div><b>PERSONAL AI</b><small>CONTROL PLANE</small></div></div><nav aria-label="設計稿頁面"><button data-page="overview">工作總覽</button><button data-page="missions">交辦</button><button data-page="tasks">執行任務</button><button data-page="workers">執行裝置</button><button data-page="members">團隊成員</button><button data-page="settings">設定</button></nav></header>
<div class="demo"><span>設計提案 01 ／ Virtual Office 視覺延伸 · 所有內容與數據均為示意</span><span>暖米白 · 森林綠 · 工作室介面</span></div>
<section class="heading"><div class="title"><span class="monogram">P</span><div><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1><p id="subtitle"></p></div></div><button class="primary" id="action"></button></section><main class="content" id="content"></main><footer>Hermes thinks · ContextHub remembers · Control Plane coordinates · Workers execute <span style="float:right">UI CONCEPT / 2026.09</span></footer>
<dialog id="detail"><div class="eyebrow">DESIGN PREVIEW</div><h2 id="dialogTitle"></h2><div id="dialogBody"></div><button onclick="document.querySelector('dialog').close()">關閉</button></dialog>
<script>
const badge=(s,c='')=>`<span class="badge ${c}">${s}</span>`;
const stats=()=>`<div class="stats">${[['待辦交辦','4'],['進行中','2'],['等你處理','1'],['今日已完成','8']].map(([a,b])=>`<div class="stat"><span>${a}</span><strong>${b}</strong></div>`).join('')}</div>`;
const people=[['H','Hermes','團隊主管 · 規劃與彙整','規劃中'],['R','Researcher','研究角色 · 綁定 GoosePC','工作中'],['W','Writer','撰寫角色 · 綁定 Mac Worker','待命']];
const team=()=>people.map(([a,b,c,d])=>`<div class="row"><span class="avatar">${a}</span><div class="grow"><h3>${b}</h3><span class="small">${c}</span></div>${badge(d)}</div>`).join('');
const activity=`<div class="activity"><b>最近動態 · 示意</b><span>14:32　研究摘要完成</span><span>14:29　GoosePC 接收執行任務</span><span>14:20　旅程規劃等待你補充資料</span></div>`;
const tasks=[['整理本週 AI 新聞','task-demo-01','執行中','GoosePC','Researcher'],['產出研究摘要','task-demo-02','已完成','Mac Worker','Writer'],['比對引用來源','task-demo-03','待派送','尚未指派','Researcher']];
const pages={overview:['WORKSPACE OVERVIEW','今天，一起完成。','從交辦到成果，掌握團隊今天的工作。','＋ 交辦工作',()=>stats()+`<div class="split"><section class="panel pad"><div class="section"><div><div class="eyebrow">YOUR TEAM</div><h2>工作室裡的夥伴</h2></div><span class="small">3 位角色 · 2 台裝置／示意</span></div>${team()}<div class="rule"></div><div class="section"><h2>正在推進的交辦</h2><button class="quiet" onclick="render('missions')">所有交辦 →</button></div><div class="row"><div class="grow"><h3>每週 AI 趨勢報告</h3><p>研究資料已完成，正在整理本週重點。</p></div>${badge('進行中')}</div><div class="row"><div class="grow"><h3>整理專案設計文件</h3><p>等待可用執行裝置。</p></div>${badge('待辦','neutral')}</div></section><aside class="panel pad"><div class="eyebrow">NEEDS YOUR ATTENTION</div><h2>有一件事，等你決定。</h2><p>補齊資訊後，團隊就能接著往下做。</p><div class="rule"></div>${badge('等待你補充','amber')}<h3 style="margin-top:16px">下個月的旅行規劃</h3><p>請補充出發日期與預算範圍。</p><button style="margin-top:16px" onclick="show('補充交辦資訊','此處預計顯示 Hermes 的問題、回覆欄位與送出動作。')">查看交辦 →</button><div class="rule"></div><div class="eyebrow">LATEST RESULT</div><h3>研究摘要已備妥</h3><p>成果可用 · 外部交付待確認</p><p class="aside-note">完成、成果可用、外部交付各自呈現，讓每個階段都能清楚確認。</p></aside></div>`+activity],
missions:['MISSIONS','團隊交辦','每一份交辦，都有清楚的進度與下一步。','＋ 新增交辦',()=>stats()+`<div class="section"><h2>工作看板</h2><span class="small">點選卡片預覽交辦詳情</span></div><div class="board">${[['待辦','4','整理專案設計文件','等待可用執行裝置','neutral'],['進行中','2','每週 AI 趨勢報告','Researcher · 正在整理資料',''],['等你處理','1','下個月的旅行規劃','需要補充日期與預算','amber'],['已完成','8','研究摘要','成果可用 · 交付待確認','']].map(([a,b,c,d,e])=>`<section class="column"><div class="column-title"><b>${a}</b><span>${b}</span></div><button class="mission" onclick="mission('${c}')">${badge(a,e)}<h3>${c}</h3><p>${d}</p><span class="small">示意交辦 · 14:32 更新 ↗</span></button><p class="small">此欄僅展示一張代表卡片</p></section>`).join('')}</div>`+activity],
tasks:['TASK EXECUTION','執行任務','查看執行輪次、裝置回報與成果。','篩選說明',()=>`<div class="toolbar"><button onclick="filterTasks('')">全部任務</button><button onclick="filterTasks('執行中')">執行中</button><button onclick="filterTasks('已完成')">已完成</button><input aria-label="搜尋任務" placeholder="搜尋任務名稱…" oninput="filterTasks(this.value)"></div><div class="split"><section class="panel tablewrap"><table><thead><tr><th>任務</th><th>狀態</th><th>執行裝置</th><th>角色</th></tr></thead><tbody id="rows"></tbody></table><p style="padding:16px">示意任務 · 點選任務，在右側查看詳情。</p></section><aside class="panel pad" id="inspector"></aside></div>`+activity],
workers:['WORKER DIRECTORY','執行裝置','管理實體運算資源，掌握連線與執行容量。','＋ 新增裝置',()=>`<div class="section"><h2>裝置目錄</h2><span class="small">3 台已註冊 · 2 台線上／示意</span></div><div class="cards">${['GoosePC','Mac Worker','NAS Worker'].map((n,i)=>`<article class="panel pad"><div class="section"><span class="avatar">${['G','M','N'][i]}</span>${badge(i===2?'離線':'線上',i===2?'neutral':'')}</div><h2>${n}</h2><p>${['Windows · 桌上型工作站','macOS · 個人工作站','Linux · 常駐節點'][i]}</p><div class="facts"><div><span>執行槽使用</span><b>${i===0?'1 / 2':i===1?'0 / 2':'未知'}</b></div><div><span>最後回報</span><b>${i===2?'2 小時前':'數秒前'}</b></div></div><div class="meter"><i style="width:${i===0?50:0}%"></i></div><p>能力 · ${i===0?'工作區執行':i===1?'模型推論':'待重新同步'}</p><button style="margin-top:20px;width:100%" onclick="show('${n}','裝置詳情採相同右側資訊區：連線、能力、執行槽、目前任務與最近回報。離線時將未知值明確標出。')">查看裝置 →</button></article>`).join('')}</div>`],
members:['TEAM & ROLES','團隊成員','讓每個角色，連結合適的執行資源。','＋ 新增角色',()=>`<div class="split"><section class="panel pad"><div class="eyebrow">THE TEAM</div><h2>工作室角色</h2>${team()}</section><aside class="panel pad"><div class="eyebrow">ROLE BINDING</div><h2>Researcher</h2><p>研究與資料整理</p><div class="rule"></div><div class="facts"><div><span>綁定裝置</span><b>GoosePC</b></div><div><span>同時執行上限</span><b>1</b></div></div><p>角色描述負責的工作；執行裝置提供實際運算能力。</p><button style="margin-top:20px" onclick="show('編輯綁定','設計稿：選擇執行裝置、能力與同時執行上限，儲存前呈現變更摘要。')">編輯綁定</button></aside></div>`],
settings:['WORKSPACE SETTINGS','工作室設定','以一致的表單與清楚的說明，管理工作環境。','檢視設計規格',()=>`<section class="panel pad settings"><div class="eyebrow">APPEARANCE · PROPOSED</div><h2>外觀與閱讀</h2><p>以下為提案中的介面偏好，尚未連接正式設定。</p><div class="setting"><div><h3>介面風格</h3><p>與 Virtual Office 共用背景、文字與元件樣式。</p></div><span class="badge">工作室 · 暖米白</span></div><div class="setting"><div><h3>資訊密度</h3><p>任務列表保留高密度閱讀的選擇。</p></div><select aria-label="資訊密度"><option>舒適</option><option>緊湊</option></select></div><div class="setting"><div><h3>減少動態效果</h3><p>沿用裝置偏好，降低不必要的動畫。</p></div><input type="checkbox" aria-label="減少動態效果" checked></div><div class="tokens">${[['背景','#f2f1eb'],['卡片','#faf9f4'],['主色','#365848'],['文字','#273d38'],['邊框','#dcded3']].map(([n,c])=>`<span class="swatch"><i style="background:${c}"></i>${n} ${c}</span>`).join('')}</div><p class="aside-note">元件規格：卡片圓角 8px · 控件圓角 5px · 輕陰影 · 狀態包含文字與圓點。手機版改為單欄，詳情接在列表下方。</p></section>`]};
function show(title,body){document.querySelector('#dialogTitle').textContent=title;document.querySelector('#dialogBody').innerHTML=`<p style="margin:15px 0 24px">${body}</p>`;document.querySelector('dialog').showModal()}
function mission(title){show(title,`<span class="eyebrow">交辦詳情 · 示意配置</span><br>目標與目前階段 → 執行步驟 → 成果與交付<br><br>${badge('執行中')}<br><br>✓ 蒐集資料<br>● 整理重點 · Researcher / GoosePC<br>○ 彙整與檢閱 · Hermes<br><br>成果：尚未產出<br>外部交付：尚未開始<br><br><small>以上為詳情版型示意，並非所選卡片的真實執行紀錄。</small>`)}
function selectTask(i){const t=tasks[i];document.querySelector('#inspector').innerHTML=`<div class="eyebrow">TASK INSPECTOR</div><h2>${t[0]}</h2>${badge(t[2])}<div class="rule"></div><div class="facts"><div><span>執行裝置</span><b>${t[3]}</b></div><div><span>負責角色</span><b>${t[4]}</b></div><div><span>目前輪次</span><b>第 1 輪</b></div><div><span>嘗試次數</span><b>${i===2?'0':'1'}</b></div></div><div class="rule"></div><h3>成果與交付</h3><p>成果：${i===1?'可用':'尚未產出'}</p><p>外部交付：${i===1?'待確認':'尚未開始'}</p><button style="margin-top:22px" onclick="show('任務詳情','完整頁面將依序顯示執行輪次、回報時間線、成果檔案與外部交付回執。')">完整執行紀錄 →</button>`;document.querySelectorAll('tbody tr').forEach(r=>r.classList.toggle('selected',Number(r.dataset.i)===i))}
function filterTasks(q){document.querySelector('#rows').innerHTML=tasks.map((t,i)=>({t,i})).filter(({t})=>t.join(' ').includes(q)).map(({t,i})=>`<tr data-i="${i}" tabindex="0" onclick="selectTask(${i})" onkeydown="if(event.key==='Enter')selectTask(${i})"><td>${t[0]}<small>${t[1]}</small></td><td>${badge(t[2])}</td><td>${t[3]}</td><td>${t[4]}</td></tr>`).join('')||'<tr><td colspan="4">沒有符合條件的示意任務。</td></tr>'}
function render(key){const p=pages[key]||pages.overview;document.querySelector('#eyebrow').textContent=p[0];document.querySelector('#title').textContent=p[1];document.querySelector('#subtitle').textContent=p[2];document.querySelector('#action').textContent=p[3];document.querySelector('#action').onclick=()=>show(p[3],'這是介面設計稿，按鈕僅展示操作位置與樣式。未連接後端，也不會建立或修改任何工作。');document.querySelector('#content').innerHTML=p[4]();document.querySelectorAll('nav button').forEach(b=>{if(b.dataset.page===key)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});if(key==='tasks'){filterTasks('');selectTask(0)}location.hash=key}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>render(b.dataset.page));render(location.hash.slice(1)||'overview');
</script></body></html>
